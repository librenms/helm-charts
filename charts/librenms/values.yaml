# Default values for librenms.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

librenms:
  image:
    # -- repository is the image repository to pull from.
    repository: librenms/librenms
    # -- tag is image tag to pull.
    tag: 26.8.1
    # -- pullPolicy is the Kubernetes image pull policy for the main LibreNMS image.
    pullPolicy: Always

  # -- Laravel APP_KEY for encryption. If blank, a random 32-character key will be generated and persisted in a Kubernetes Secret.
  # You may also provide a base64-encoded key (prefix with 'base64:').
  # Example: appkey: "base64:QWERTYUIOPASDFGHJKLZXCVBNMqwertyuiopasdfghjklzxcvbnm=="
  appkey: ""

  # -- Existing secret name to use for appkey
  # Must have the key 'appkey' as above
  existingSecret: false

  # -- Timezone used by librenms for communication with RRD cached
  timezone: UTC

  # -- Custom configuration options for LibreNMS. For more information on options
  # in this file check the following link:
  # https://docs.librenms.org/Support/Configuration/
  configuration: |
    $config['distributed_poller_group']          = '0';
    $config['distributed_poller']                = true;

  # -- Extra environment variables applied to all LibreNMS components
  extraEnvs: []

  # -- Extra envFrom sources applied to all LibreNMS components
  extraEnvFrom: []

  # Global setting to run components as privileged, set as a bool
  # Optionally, the frontend and pollers can be individually run as privileged
  privileged: false

  # -- initContainer configuration options
  initContainer:
    image:
      # -- repository is the init container image repository to pull from.
      repository: busybox
      # -- tag is the init container image tag to pull.
      tag: "1.38"
      # -- pullPolicy is the Kubernetes image pull policy for the init container image.
      pullPolicy: Always
    # -- resources defines the computing resources (CPU and memory)
    # that are allocated to the init container.
    resources: {}
      # requests:
      #   cpu: 10m
      #   memory: 16Mi
      # limits:
      #   cpu: 50m
      #   memory: 32Mi
    # -- securityContext defines the security settings for the init container.
    securityContext: {}
      # allowPrivilegeEscalation: false
      # runAsNonRoot: true
      # runAsUser: 1000

  # Frontend container configurations options
  frontend:
    # -- Frontend enabled
    enabled: true
    # -- Frontend replicas
    replicas: 1
    readinessProbe:
      httpGet:
        # -- Check endpoint path
        path: /login
        # -- Check endpoint port
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 60
      timeoutSeconds: 10
    # -- resources defines the computing resources (CPU and memory)
    # that are allocated to the containers running within the Pod.
    resources: {}
      # We usually recommend not to specify default resources and to leave this as a conscious
      # choice for the user. This also increases chances charts run on environments with little
      # resources, such as Minikube. If you do want to specify resources, uncomment the following
      # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
      # requests:
      #   cpu: 50m
      #   memory: 150M

    # Bool to control running the frontend pods as privileged
    # The default is false.
    privileged: false

    # -- podAnnotations for frontend pods
    podAnnotations: {}

    # -- nodeSelector for frontend pods
    nodeSelector: {}

    # -- Externally visible base URL of this instance, including scheme (e.g.
    # "https://librenms.example.com"). Written to Laravel's .env as APP_URL so
    # URLs are generated correctly when TLS is terminated at an ingress.
    appUrl: ""

    # -- Proxy IPs/CIDRs (or "*") whose X-Forwarded-* headers Laravel should
    # trust. Written to Laravel's .env as APP_TRUSTED_PROXIES.
    appTrustedProxies: []

    # -- Extra volumes for frontend pods
    extraVolumes: []

    # -- Extra volume mounts for frontend containers
    extraVolumeMounts: []

    # -- Extra environment variables for frontend containers
    extraEnvs: []

    # -- Extra envFrom sources for frontend containers
    extraEnvFrom: []

  # Distributed poller container configurations options
  poller:
    # -- Poller name
    name: ""
    # -- Poller replicas
    replicas: 2
    # -- resources defines the computing resources (CPU and memory)
    # that are allocated to the containers running within the Pod.
    resources: {}
      # requests:
      #   cpu: 500m
      #   memory: 200M

    # Bool to control running the poller pods as privileged
    # The default is false
    privileged: false

    # -- podAnnotations for poller pods
    podAnnotations: {}

    # -- nodeSelector for poller pods
    nodeSelector: {}

    # -- Extra volumes for poller pods
    extraVolumes: []

    # -- Extra volume mounts for poller containers
    extraVolumeMounts: []

    # -- Extra environment variables for poller containers
    extraEnvs: []

    # -- Extra envFrom sources for poller containers
    extraEnvFrom: []

  # -- SNMP network discovery scanner cron job. This job is optional and only use
  # when having snmp network discovery enabled. For this to work either set the
  # 'nets' configuration in the custom config on in the admin interface
  # See the following link for more information:
  # https://docs.librenms.org/Extensions/Auto-Discovery/
  snmp_scanner:
    # -- SNMP scanner enabled
    enabled: false
    # -- SNMP scanner cronjob syntax interval
    cron: 15 * * * *
    # -- securityContext defines the security settings for the SNMP scanner pod.
    # These settings are required for the SNMP scanner to run properly.
    # See: https://github.com/librenms/docker/pull/530
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    # -- resources defines the computing resources (CPU and memory)
    # that are allocated to the containers running within the Pod.
    resources: {}
      # requests:
      #   cpu: 500m
      #   memory: 200M

    # -- podAnnotations for SNMP scanner pods
    podAnnotations: {}

    # -- nodeSelector for SNMP scanner pods
    nodeSelector: {}

    # -- Extra environment variables for SNMP scanner containers
    extraEnvs: []

    # -- Extra envFrom sources for SNMP scanner containers
    extraEnvFrom: []

  # -- syslog-ng sidecar for receiving syslog messages from network devices on port 514.
  # Requires $config['enable_syslog'] = true; in librenms.configuration to store messages.
  # See: https://docs.librenms.org/Extensions/Syslog/
  syslogng:
    # -- Enable syslog-ng
    enabled: false
    # -- syslogng replicas
    replicas: 1
    # -- resources defines the computing resources (CPU and memory)
    # that are allocated to the syslog-ng container.
    resources: {}
      # requests:
      #   cpu: 100m
      #   memory: 128M

    # -- podAnnotations for syslogng pods
    podAnnotations: {}

    # -- nodeSelector for syslogng pods
    nodeSelector: {}

    service:
      # -- Service type for the syslog receiver. Devices outside the cluster need
      # LoadBalancer or NodePort to reach it.
      type: ClusterIP
      # -- Annotations for the syslogng service
      annotations: {}
      # -- Static IP to request when type is LoadBalancer
      loadBalancerIP: ""
      # -- externalTrafficPolicy for the service. Set to "Local" to preserve the
      # source IP of incoming messages, which LibreNMS needs to match a message
      # to a device. Only applies to LoadBalancer and NodePort services.
      externalTrafficPolicy: ""

    # -- Extra environment variables for syslogng containers
    extraEnvs: []

    # -- Extra envFrom sources for syslogng containers
    extraEnvFrom: []

  # -- snmptrapd sidecar for receiving SNMP traps from network devices on port 162.
  # Traps are passed to LibreNMS' snmptrap.php handler, which matches them to a
  # device by the source IP of the trap, so the sending device must already be
  # monitored. See: https://docs.librenms.org/Extensions/SNMP-Trap-Handler/
  snmptrapd:
    # -- Enable snmptrapd
    enabled: false
    # -- snmptrapd replicas
    replicas: 1
    # -- SNMP v1/v2c community string devices must send their traps with.
    # Change this from the image default before exposing the receiver.
    community: librenmsdocker
    # -- Which snmptrapd processing types (log, execute and/or net) to apply to
    # accepted traps. LibreNMS needs 'execute' for its trap handler to run.
    processingType: log,execute,net
    # -- Accept traps without checking them against the community string or the
    # SNMPv3 user below. Set to "no" to enforce authorization.
    disableAuthorization: "yes"
    # -- Additional colon-separated MIB directories to load
    # (e.g. "/opt/librenms/mibs/veeam"). The standard and Cisco MIB directories
    # are always loaded.
    extraMibDirs: ""

    # SNMPv3 credentials used to authenticate traps
    snmpv3:
      # -- SNMPv3 username
      user: librenms_user
      # -- SNMPv3 authentication protocol (MD5 or SHA)
      authProtocol: SHA
      # -- SNMPv3 privacy protocol (DES or AES)
      privProtocol: AES
      # -- SNMPv3 security level (noauth, auth or priv)
      securityLevel: priv
      # -- SNMPv3 engine ID
      engineId: "1234567890"
      # -- SNMPv3 authentication password. Left blank the image default
      # ('auth_pass') applies, which should not be used in production.
      authPassword: ""
      # -- SNMPv3 privacy password. Left blank the image default ('priv_pass')
      # applies, which should not be used in production.
      privPassword: ""
      # -- Read the SNMPv3 passwords from an existing secret instead of the two
      # values above. Takes precedence over authPassword and privPassword.
      existingSecret:
        # -- Name of the secret holding the SNMPv3 passwords
        name: ""
        # -- Key in the secret containing the authentication password
        authKey: "snmp-auth-password"
        # -- Key in the secret containing the privacy password
        privKey: "snmp-priv-password"

    service:
      # -- Service type for the trap receiver. Devices outside the cluster need
      # LoadBalancer or NodePort to reach it.
      type: ClusterIP
      # -- Annotations for the snmptrapd service
      annotations: {}
      # -- Static IP to request when type is LoadBalancer
      loadBalancerIP: ""
      # -- externalTrafficPolicy for the service. Set to "Local" to preserve the
      # source IP of incoming traps, which LibreNMS needs to match a trap to a
      # device. Only applies to LoadBalancer and NodePort services.
      externalTrafficPolicy: ""

    # -- resources defines the computing resources (CPU and memory)
    # that are allocated to the snmptrapd container.
    resources: {}
      # requests:
      #   cpu: 100m
      #   memory: 128M

    # -- podAnnotations for snmptrapd pods
    podAnnotations: {}

    # -- nodeSelector for snmptrapd pods
    nodeSelector: {}

    # -- Extra environment variables for snmptrapd containers
    extraEnvs: []

    # -- Extra envFrom sources for snmptrapd containers
    extraEnvFrom: []

  # -- RRD cached is the tool that allows for distributed polling and is mandatory
  # in this LibreNMS helm chart. See the rrdcached documentation for more
  # information: https://oss.oetiker.ch/rrdtool/doc/rrdcached.en.html
  rrdcached:
    # -- RRDCached enabled
    enabled: true
    image:
      # -- repository is the image repository to pull from.
      repository: crazymax/rrdcached
      # -- tag is image tag to pull.
      tag: 1.8.0
      # -- pullPolicy is the Kubernetes image pull policy for the RRDCached image.
      pullPolicy: Always
    persistence:
      # -- RRDCached persistent volume enabled
      enabled: true
      journal:
        # -- RRDCached journal PV size
        size: 1Gi
        # -- RRDCached journal storage class name
        storageClassName: ""
      rrdcached:
        # -- RRDCached RRD storage PV size
        size: 10Gi
        # -- RRDCached RRD storage class name
        storageClassName: ""
    # -- resources defines the computing resources (CPU and memory)
    # that are allocated to the containers running within the Pod.
    resources: {}
      # requests:
      #   cpu: 100m
      #   memory: 500M
    readinessProbe:
      # -- RRD cached readiness probe
      tcpSocket:
        port: 42217
      initialDelaySeconds: 5
      periodSeconds: 10
    livenessProbe:
      # -- RRD cached liveness probe
      tcpSocket:
        port: 42217
      initialDelaySeconds: 15
      periodSeconds: 20
    envs:
    # -- env variables RRD Cached
    - name: WRITE_JITTER
      value: "1800"
    - name: WRITE_TIMEOUT
      value: "1800"

    # -- Extra environment variables for RRDCached containers
    extraEnvs: []

    # -- Extra envFrom sources for RRDCached containers
    extraEnvFrom: []

    # -- podAnnotations for rrdcached pods
    podAnnotations: {}

    # -- nodeSelector for rrdcached pods
    nodeSelector: {}

    # -- Extra volumes for rrdcached pods
    extraVolumes: []

    # -- Extra volume mounts for rrdcached containers
    extraVolumeMounts: []

# -- External Redis configuration. Used when `redis.enabled` is false. Leave
# `host` blank to run without Redis at all, in which case LibreNMS falls back to
# the file cache and session drivers -- only safe for a single frontend replica,
# since pollers and frontends no longer share cache or session state.
externalRedis:
  # -- Redis host (DNS name or IP address)
  host: ""
  # -- Redis port
  port: 6379
  # -- Redis database number
  db: 0

# -- LibreNMS ingress configuration
ingress:
  # -- Enable or disable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress rules
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- LibreNMS Gateway API configuration. Renders an HTTPRoute for the frontend as
# an alternative to `ingress`, for clusters running a Gateway API implementation.
# The Gateway itself is not created by this chart -- it is usually shared across
# namespaces and managed separately. Requires the Gateway API CRDs (HTTPRoute is
# stable at gateway.networking.k8s.io/v1 as of Gateway API v1.0).
#
# Only the frontend is exposed this way. The syslog-ng and snmptrapd sidecars are
# deliberately left on plain Services: routing them through a Gateway replaces the
# sender's address with the Gateway's, and LibreNMS resolves a message or trap to a
# device by that address. See the Syslog section of the README.
gateway:
  # -- Enable or disable the HTTPRoute
  enabled: false
  # -- Annotations for the HTTPRoute
  annotations: {}
  # -- Gateways this route attaches to. Required when enabled. Each entry accepts
  # the usual parentRef fields (name, namespace, sectionName, port).
  parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-system
    #   sectionName: https
  # -- Hostnames this route matches. Leave empty to match every hostname the
  # parent Gateway listener accepts.
  hostnames: []
    # - librenms.example.com
  # -- Path matches. Each entry becomes an HTTPRoute rule backed by the frontend
  # service on port 8000.
  paths:
    - path: /
      pathType: PathPrefix

# -- Configuration for MySQL dependency chart by HelmForge. See their chart for
# more information: https://github.com/helmforgedev/charts/tree/main/charts/mysql
mysql:
  enabled: true
  architecture: standalone
  auth:
    username: librenms
    database: librenms
  # -- Use an existing secret for MySQL authentication instead of the auto-generated one.
  # This is useful when migrating from the Bitnami MySQL subchart, which created a secret
  # named "RELEASE-mysql" with key "mysql-password".
  # Example for Bitnami migration:
  #   existingAuthSecret:
  #     name: my-release-mysql
  #     key: mysql-password
  existingAuthSecret: {}
  # -- Server configuration appended to the subchart's my.cnf.
  # `character-set-server`/`collation-server` set the utf8mb4_unicode_ci collation required by
  # LibreNMS. MySQL 8.4 defaults to utf8mb4_0900_ai_ci, which causes validation warnings.
  # See: https://community.librenms.org/t/new-default-database-charset-collation/14956
  # `skip-log-bin` disables the binary log. MySQL 8+ enables it by default with 30 days of
  # retention, and LibreNMS writes to the database on every poll, so the binlog can grow by
  # tens of GB and fill the data PVC. It is only needed for replication or point-in-time
  # recovery; the subchart re-enables it on the source pod when `architecture: replication`.
  config:
    myCnf: |
      [mysqld]
      character-set-server=utf8mb4
      collation-server=utf8mb4_unicode_ci
      skip-log-bin
  standalone:
    persistence:
      enabled: true
      size: 8Gi

# -- External database configuration. Used when mysql.enabled is false.
# When mysql.enabled is true (default), the bundled MySQL subchart is used and these values are ignored.
externalDatabase:
  # -- DB host (DNS name or IP). Supports both "hostname" or "hostname:port" formats.
  # If port is included in the host field, it takes precedence over the separate port field.
  # Example: "mysql.example.svc.cluster.local", "10.0.0.12", or "mysql.example.com:3307"
  host: ""
  # -- DB port (MySQL default 3306). Optional if port is included in the host field.
  port: 3306
  # -- Database name
  name: "librenms"
  # -- Database username
  user: "librenms"

  # -- Where to get the DB password:
  # Option A: reference an existing Secret (recommended for production)
  existingSecret:
    # -- Name of the secret containing the database password
    name: ""
    # -- Key in the secret that contains the database password
    key: "mysql-password"

  # Option B: literal password (not recommended for production, but useful for testing)
  # -- Database password (plain text). Use existingSecret instead for production.
  password: ""

  # -- Optional: DB connection timeout in seconds
  timeout: 60

# -- Configuration for redis dependency chart by HelmForge. See their chart for
# more information: https://github.com/helmforgedev/charts/tree/main/charts/redis
redis:
  enabled: true
  auth:
    enabled: false
  architecture: standalone
