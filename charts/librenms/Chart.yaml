apiVersion: v2
name: librenms
description: LibreNMS is an autodiscovering PHP/MySQL-based network monitoring system.
type: application
version: 10.2.2
appVersion: "26.9.1.1"
kubeVersion: ">=1.26.0-0"
maintainers:
  - name: jacobw
    url: https://github.com/jacobw
dependencies:
  - name: redis
    version: "3.0.3"
    repository: "https://repo.helmforge.dev"
    condition: redis.enabled
  - name: mysql
    version: "~2.1.0"
    repository: "https://repo.helmforge.dev"
    condition: mysql.enabled
