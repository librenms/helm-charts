{{- if .Values.librenms.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "librenms.labels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  selector:
    {{- include "librenms.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: {{ .Release.Name }}
      protocol: TCP
      port: 8000
      targetPort: 8000
{{- end }}
