{{- if .Values.librenms.syslogng.enabled }}
{{- $svc := .Values.librenms.syslogng.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-syslogng
  labels:
    {{- include "librenms.labels" (dict "root" . "component" "syslogng") | nindent 4 }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type }}
  {{- with $svc.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with $svc.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    {{- include "librenms.selectorLabels" (dict "root" . "component" "syslogng") | nindent 4 }}
  ports:
    - name: syslog-udp
      protocol: UDP
      port: 514
      targetPort: 514
    - name: syslog-tcp
      protocol: TCP
      port: 514
      targetPort: 514
{{- end }}
