name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
      packages: write
      pull-requests: write
      # creating and updating labels is an issues-scoped operation
      issues: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Add repositories
        run: helm repo add helmforge https://repo.helmforge.dev

      - name: Generate and commit helm docs
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          chart-search-root: ./charts/librenms
          template-files: README.md.gotmpl
          output-file: README.md
          git-push: true
          git-commit-message: "docs: auto-update helm docs"

      # release-please's pull request is authored by whichever identity its token
      # belongs to. secrets.GITHUB_TOKEN authors as github-actions[bot], which holds
      # no access to this repository, and Actions holds pull_request runs on such
      # pull requests behind manual approval.
      #
      # Falls back to secrets.GITHUB_TOKEN when the app is not configured.
      - name: Mint a release-please app token
        id: release-please-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # release-please owns the version, the changelog, the tag and the GitHub
      # release. It therefore writes the release body from CHANGELOG.md and moves
      # its own pull request from `autorelease: pending` to `autorelease: tagged`.
      # chart-releaser is reduced to packaging and indexing.
      - name: Run release-please
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-please-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # release-please otherwise targets the repository default branch,
          # which is not necessarily the branch this workflow is filtered to.
          target-branch: main

      # The action's own run always creates a GitHub release, so it is used here
      # purely as an installer and cr is driven directly. install_only exports PATH
      # inside the action's shell only, so install_dir is set and wired explicitly.
      - name: Install chart-releaser
        if: steps.release-please.outputs.releases_created == 'true'
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          install_only: true
          install_dir: ${{ runner.temp }}/cr
          version: v1.8.1

      - name: Package the chart
        if: steps.release-please.outputs.releases_created == 'true'
        run: ${{ runner.temp }}/cr/cr package charts/librenms --package-path .cr-release-packages

      - name: Attach the package to the release
        if: steps.release-please.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-please.outputs['charts/librenms--tag_name'] }}
        run: gh release upload "$TAG" .cr-release-packages/*.tgz --clobber --repo "$GITHUB_REPOSITORY"

      # cr index resolves each package's release by name and indexes the asset URL
      # off it, so the package must already be attached above.
      - name: Update the chart repository index
        if: steps.release-please.outputs.releases_created == 'true'
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cr-index
          ${{ runner.temp }}/cr/cr index -o "${GITHUB_REPOSITORY_OWNER}" -r "${GITHUB_REPOSITORY#*/}" --push

      # see https://github.com/helm/chart-releaser/issues/183
      - name: Login to GitHub Container Registry
        if: steps.release-please.outputs.releases_created == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to GHCR
        if: steps.release-please.outputs.releases_created == 'true'
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            helm push "${pkg}" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          done
