name: Release Charts

on: push

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      pull-requests: write
      # creating and updating labels is an issues-scoped operation
      issues: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Add repositories
        run: |
          for dir in $(ls -d charts/*/); do
            helm dependency list $dir 2> /dev/null | tail +2 | head -n -1 | awk '{ print "helm repo add " $1 " " $3 }' | while read cmd; do $cmd; done
          done
          
      - name: Generate and commit helm docs
        uses: losisin/helm-docs-github-action@3a4528e97c49a5e83de6b78c50c61c8ee5c9f944 # v2.0.0
        with:
          chart-search-root: ./charts/librenms
          template-files: README.md.gotmpl
          output-file: README.md
          git-push: true
          git-commit-message: "docs: auto-update helm docs"

      # release-please owns the chart version, so an ordinary merge to main
      # changes chart files without changing the version. chart-releaser
      # discovers changed charts by file diff rather than by version, so
      # publishing has to be gated on the version itself: without this it
      # repackages the released version and fails on the existing tag.
      - name: Check whether the chart version is already released
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -m1 '^version:' charts/librenms/Chart.yaml | awk '{print $2}')
          if gh release view "librenms-${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "librenms-${version} is already released; skipping publication."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Run chart-releaser
        if: steps.release-check.outputs.new == 'true'
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # see https://github.com/helm/chart-releaser/issues/183
      - name: Login to GitHub Container Registry
        if: steps.release-check.outputs.new == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to GHCR
        if: steps.release-check.outputs.new == 'true'
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*; do
            if [ -z "${pkg:-}" ]; then
              break
            fi
            helm push "${pkg}" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          done

      # chart-releaser sets the release body to the chart description. Replace it
      # with the changelog section for this version, which release-please commits
      # alongside the version bump and so is present in this checkout.
      - name: Set release notes from the changelog
        if: steps.release-check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release-check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag = 1; next }
            /^## \[/ { flag = 0 }
            flag' charts/librenms/CHANGELOG.md | sed '/./,$!d' > "${RUNNER_TEMP}/release-notes.md"
          if [ ! -s "${RUNNER_TEMP}/release-notes.md" ]; then
            echo "No changelog section for ${VERSION}; leaving the generated release body in place."
            exit 0
          fi
          gh release edit "librenms-${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"

      # release-please marks a release finished by moving its release pull request
      # from `autorelease: pending` to `autorelease: tagged`. skip-github-release
      # hands tagging to chart-releaser, so release-please never relabels, and every
      # later run aborts with "untagged, merged release PRs outstanding".
      - name: Mark the release pull request as tagged
        if: steps.release-check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "autorelease: tagged" --repo "$GITHUB_REPOSITORY" \
            --color ededed --description "release-please: release has been tagged" --force
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
            --label "autorelease: pending" --json number --jq '.[].number' \
          | while read -r pr; do
              gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" \
                --add-label "autorelease: tagged" --remove-label "autorelease: pending"
            done

      # release-please's pull request is authored by whichever identity its token
      # belongs to. secrets.GITHUB_TOKEN authors as github-actions[bot], which holds
      # no access to this repository, and Actions holds pull_request runs on such
      # pull requests behind manual approval. Approving starts chart testing from
      # cold, so the roughly eleven minutes it takes are spent at the point of merge
      # rather than while the release pull request sits open. Runs on pull requests
      # opened by an app installation identity start unheld.
      #
      # Falls back to secrets.GITHUB_TOKEN, and so to the current behaviour, when the
      # app is not configured.
      - name: Mint a release-please app token
        id: release-please-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Runs after chart-releaser so the release it just published is visible as
      # the starting point for the next changelog. release-please owns the chart
      # version and CHANGELOG.md; chart-releaser owns tags and GitHub releases.
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-please-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # release-please otherwise targets the repository default branch,
          # which is not necessarily the branch this job is gated to.
          target-branch: main
